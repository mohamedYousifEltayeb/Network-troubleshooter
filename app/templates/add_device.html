<!doctype html>
<html>
    <head>
        <title>Device Format</title>
		<link rel="stylesheet" href="/static/style.css">
    </head>

    <body>
        <div class="head"><h1>Device Format</h1></div>

       <div> <form action="/devices" method = "POST">
	   {% if errors %}
				<ul>
				{% for message in errors %}
				   <li>{{message}}</li>
				{% endfor %}
				</ul>
	    {% endif %}

            <label for="hostname">Hostname</label>: <input id = "hostname" name = "hostname" type = "text" value ="{{hostname or ''}}"placeholder="Enter hostname here...."></input>
			<br></br>
			<label for="management_ip"> Management IP</label>: <input id="management_ip" name ="management_ip" type = "text" value ="{{management_ip or ''}}" placeholder="Enter ip here...."></input>
			<br></br>
			<label for="model">Model</label>: <input id = "model"name = "model"  type = "text" value ="{{model or ''}}" placeholder="Enter model here...."></input>
			<br></br>
			<label for="vendor">Vendor</label>:
  <select id="vendor" name="vendor">
    <option value="cisco" {% if vendor == "cisco" %} selected {% endif %}>Cisco</option>
    <option value="Juniper"{% if vendor == "Juniper" %} selected {% endif %}>Juniper</option>
    <option value="Huawei" {% if  vendor =="Huawei" %} selected {% endif %}>Huawei</option>
  </select>
  <br></br>
  <label for ="device_type">Device Type</label>:
  <select id="device_type" name="device_type">
    <option value="router" {% if device_type == "router" %} selected {% endif %}>Router</option>
    <option value="switch" {% if device_type == "switch" %} selected {% endif %}>Switch</option>
    <option value="Firewall" {% if device_type == "Firewall" %} selected {% endif %}>Firewall</option>
  </select>
  <br></br>
  <label for = "location"> Location</label>: <input id = "label" name = "location" type = "text" value ="{{location or ''}}" placeholder="Enter location here...."></input>
		<br></br>
		<button type="submit"> Add Device </button>
		</form>
		</div>

    </body>
</html>
