<!doctype html>
<html>
<head>
    <title>Edit Device</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="head">
        <h1>Edit Device</h1>
    </div>

    <div>
        <form action="/devices/{{ device.id }}/edit" method="POST">

            <label for="hostname">Hostname</label>
            <input
                id="hostname"
                name="hostname"
                type="text"
                value="{{ device.hostname }}"
            >

            <br><br>

            <label for="management_ip">Management IP</label>
            <input
                id="management_ip"
                name="management_ip"
                type="text"
                value="{{ device.management_ip }}"
            >

            <br><br>

            <label for="model">Model</label>
            <input
                id="model"
                name="model"
                type="text"
                value="{{ device.model }}"
            >

            <br><br>

            <label for="vendor">Vendor</label>

            <select id="vendor" name="vendor">
                <option value="cisco"
                    {% if device.vendor == "cisco" %}selected{% endif %}>
                    Cisco
                </option>

                <option value="Juniper"
                    {% if device.vendor == "Juniper" %}selected{% endif %}>
                    Juniper
                </option>

                <option value="Huawei"
                    {% if device.vendor == "Huawei" %}selected{% endif %}>
                    Huawei
                </option>
            </select>

            <br><br>

            <label for="device_type">Device Type</label>

            <select id="device_type" name="device_type">
                <option value="router"
                    {% if device.device_type == "router" %}selected{% endif %}>
                    Router
                </option>

                <option value="switch"
                    {% if device.device_type == "switch" %}selected{% endif %}>
                    Switch
                </option>

                <option value="Firewall"
                    {% if device.device_type == "Firewall" %}selected{% endif %}>
                    Firewall
                </option>
            </select>

            <br><br>

            <label for="location">Location</label>

            <input
                id="location"
                name="location"
                type="text"
                value="{{ device.location }}"
            >

            <br><br>

            <button type="submit">Save</button>

        </form>
    </div>

</body>
</html>
